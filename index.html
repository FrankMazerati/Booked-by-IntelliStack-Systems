<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booked by IntelliStack</title>
  <!-- Link your CSS file here -->
  <link rel="stylesheet" href="style.css">
  <!-- Import Google Fonts here if needed -->
</head>
<body>

  <!-- 1. TOOLBAR (Sits on top of the hero image) -->
  <nav class="navbar">
    <div class="nav-left">
      <!-- REPLACE WITH YOUR SMALL B/CHECKMARK LOGO -->
      <img src="your-small-logo.png" alt="Booked Icon" class="nav-logo-icon">
    </div>
    <div class="nav-right">
      <!-- User profile and menu icons from your screenshot -->
      <span class="user-badge">Diamond Carter</span>
      <div class="menu-icon">☰</div>
    </div>
  </nav>

  <!-- 2. HERO SECTION (Full screen, image starts at the very top) -->
  <section class="hero-section">
    
    <!-- 3. BRAND LOGO BLOCK (Centered above the text) -->
    <div class="hero-brand-logo">
      <!-- REPLACE WITH YOUR LARGE B/CHECKMARK LOGO -->
      <img src="your-large-logo.png" alt="Booked Logo" class="brand-icon">
      
      <!-- If your logo image already contains the text, delete the h1 and p tags below -->
      <h1 class="brand-name">Booked</h1>
      <p class="brand-tagline">Find it. Choose it. Book it.</p>
      <p class="brand-credit">by IntelliStack Systems</p>
    </div>

    <!-- 4. UNIFIED HERO TEXT -->
    <div class="hero-text">
      <h1 class="hero-font">
        Discover the people and places that help you <span class="highlight">feel your best.</span>
      </h1>
      <p class="hero-font">
        Make time for what matters most!<br>
        Real People. Real Services. In Real Time.
      </p>
    </div>

  </section>

</body>
</html>
