<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booked by IntelliStack</title>
  <!-- Add your font link here (e.g., Google Fonts) -->
</head>
<body>

  <!-- 1. TOOLBAR (Overlays the hero image) -->
  <nav class="navbar">
    <div class="nav-left">
      <!-- Add your menu/logo icon here if needed, but the main logo is in the hero -->
    </div>
    <div class="nav-right">
      <!-- User profile, notifications, menu from your screenshot -->
      <span class="user-badge">Diamond Carter</span>
    </div>
  </nav>

  <!-- 2. HERO SECTION (Starts at the very top of the page) -->
  <section class="hero-section">
    
    <!-- 3. LOGO BLOCK (Right above the text) -->
    <div class="hero-brand-logo">
      <!-- The "B" with checkmark logo -->
      <img src="booked-logo.png" alt="Booked Logo" class="brand-icon">
      <!-- The wordmark -->
      <h1 class="brand-name">Booked</h1>
      <p class="brand-tagline">Find it. Choose it. Book it.</p>
      <p class="brand-credit">by IntelliStack Systems</p>
    </div>

    <!-- 4. UNIFIED TEXT BLOCK (Same font for both) -->
    <div class="hero-text">
      <h1 class="hero-font">Discover the people and places that help you <span class="highlight">feel your best.</span></h1>
      <p class="hero-font">Make time for what matters most!<br>Real People. Real Services. In Real Time.</p>
    </div>

  </section>

</body>
</html>
